name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.asset_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset_target: aarch64-apple-darwin
          - os: macos-14
            asset_target: x86_64-apple-darwin
          - os: ubuntu-latest
            asset_target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.asset_target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The server embeds web/dist at compile time, so the client is built first.
      - name: Build web
        run: npm ci && npm run build
        working-directory: web

      - name: Build release binary
        run: cargo build --release -p ceilidh-cli --target ${{ matrix.asset_target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg
          cp "target/${{ matrix.asset_target }}/release/ceilidh" dist/pkg/ceilidh
          tar -C dist/pkg -czf "dist/ceilidh-${version}-${{ matrix.asset_target }}.tar.gz" ceilidh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      # Kept for the checksums job, which needs every tarball in one place.
      - name: Keep the tarball for checksums
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.asset_target }}
          path: dist/*.tar.gz
          retention-days: 1

  checksums:
    name: Checksums
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download every tarball
        uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS
          generate_release_notes: true
