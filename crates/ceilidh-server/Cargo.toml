[package]
name = "ceilidh-server"
description = "The caller's HTTP surface: axum API, SSE events, embedded web UI, SQLite store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
ceilidh-protocol.workspace = true
ceilidh-caller.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures-core.workspace = true
futures-util.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
tracing.workspace = true
# debug-embed keeps dev builds identical to release (no runtime path lookup);
# interpolate-folder-path expands $OUT_DIR, where build.rs stages the client.
rust-embed = { workspace = true, features = ["debug-embed", "interpolate-folder-path", "mime-guess"] }

[dev-dependencies]
futures-util.workspace = true
tower.workspace = true
